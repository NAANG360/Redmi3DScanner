name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Bundle MiDaS-small depth model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --connect-timeout 20 "https://github.com/isl-org/MiDaS/releases/download/v2_1/model-small.onnx" --output app/src/main/assets/midas_small.onnx
          test "$(stat -c%s app/src/main/assets/midas_small.onnx)" -gt 1000000
          cp licenses/MIDAS-MIT-LICENSE.txt app/src/main/assets/midas_license.txt

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi3DScanner-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error